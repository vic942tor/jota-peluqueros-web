<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservas - Jota Peluqueros</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/main.js" defer></script>
</head>
<body>
    <div class="form-container">
        <h2>Pide tu cita</h2>
        <form id="bookingForm">
            <div class="form-group">
                <label>1. ¿Qué día quieres venir?</label>
                <input type="date" id="date" required>
            </div>
            
            <div class="form-group">
                <label>2. Horas disponibles</label>
                <div class="time-grid" id="timeGrid">
                    <button type="button" class="time-btn">10:00</button>
                    <button type="button" class="time-btn">10:30</button>
                    <button type="button" class="time-btn">11:00</button>
                    <button type="button" class="time-btn">11:30</button>
                    <button type="button" class="time-btn">12:00</button>
                    <button type="button" class="time-btn">12:30</button>
                </div>
            </div>

            <div class="form-group">
                <label>3. Tus datos</label>
                <input type="text" id="name" placeholder="Tu nombre" required style="margin-bottom: 10px;">
                <input type="tel" id="phone" placeholder="Tu teléfono" required>
            </div>

            <button type="submit" class="submit-btn">Confirmar Reserva</button>
        </form>
    </div>
</body>
</html>
