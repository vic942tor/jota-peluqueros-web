<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jota Peluqueros</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            text-align: center; 
            margin: 0;
            padding: 40px 20px;
            background-color: #f3f4f6; /* Fondo gris muy suave */
            color: #1f2937;
        }
        .hero { margin-bottom: 40px; }
        h1 { font-size: 2.5rem; margin-bottom: 10px; }
        p { font-size: 1.1rem; color: #4b5563; }
        
        /* Contenedor tipo tarjeta para integrar el calendario */
        #reserva { 
            max-width: 900px; 
            margin: 0 auto; 
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 20px;
            min-height: 550px;
        }
    </style>
</head>
<body>
    <div class="hero">
        <h1>Jota Peluqueros</h1>
        <p>Tu estilo, sin complicaciones. Reserva tu cita online.</p>
    </div>
    
    <div id="reserva">
        <!-- Cal inline embed code begins -->
        <div style="width:100%;height:100%;overflow:scroll" id="my-cal-inline-corte-de-pelo"></div>
        <script type="text/javascript">
          (function (C, A, L) { let p = function (a, ar) { a.q.push(ar); }; let d = C.document; C.Cal = C.Cal || function () { let cal = C.Cal; let ar = arguments; if (!cal.loaded) { cal.ns = {}; cal.q = cal.q || []; d.head.appendChild(d.createElement("script")).src = A; cal.loaded = true; } if (ar[0] === L) { const api = function () { p(api, arguments); }; const namespace = ar[1]; api.q = api.q || []; if(typeof namespace === "string"){cal.ns[namespace] = cal.ns[namespace] || api;p(cal.ns[namespace], ar);p(cal, ["initNamespace", namespace]);} else p(cal, ar); return;} p(cal, ar); }; })(window, "https://app.cal.com/embed/embed.js", "init");
        Cal("init", "corte-de-pelo", {origin:"https://app.cal.com"});
        Cal.config = Cal.config || {};
        Cal.config.forwardQueryParams = true;

          Cal.ns["corte-de-pelo"]("inline", {
            elementOrSelector:"#my-cal-inline-corte-de-pelo",
            config: {"layout":"month_view","useSlotsViewOnSmallScreen":"true"},
            calLink: "vic942tor/corte-de-pelo",
          });

          /* tema claro y ocultamos el panel lateral de detalles */
          Cal.ns["corte-de-pelo"]("ui", {
              "hideEventTypeDetails": true,
              "layout": "month_view",
              "theme": "light"
          });
          </script>
          <!-- Cal inline embed code ends -->
    </div>
</body>
</html>
