<div class="booking-overlay" id="bookingOverlay" hidden>
    <div class="booking-modal" role="dialog" aria-modal="true" aria-labelledby="bookingTitle">
        <button type="button" class="booking-close" id="bookingClose" aria-label="Cerrar" data-i18n-aria-label="booking.closeAria">&times;</button>

        <h2 id="bookingTitle" data-i18n="booking.title">Pide tu cita</h2>

        <form id="bookingForm" novalidate>
            <div class="booking-field">
                <label for="bookingDate" data-i18n="booking.dateLabel">Fecha</label>
                <input type="date" id="bookingDate" name="fecha" required>
            </div>

            <div class="booking-field" id="bookingSlotsField" hidden>
                <label data-i18n="booking.hourLabel">Hora</label>
                <div class="booking-slots" id="bookingSlots"></div>
            </div>

            <div class="booking-field" id="bookingStaffField" hidden>
                <label data-i18n="booking.staffLabel">Peluquero/a</label>
                <div class="booking-slots" id="bookingStaffOptions"></div>
            </div>

            <p class="booking-status" id="bookingStatus" aria-live="polite"></p>

            <div class="booking-field" id="bookingContactFields" hidden>
                <label for="bookingName" data-i18n="booking.nameLabel">Nombre</label>
                <input type="text" id="bookingName" name="nombre" required autocomplete="name">

                <label for="bookingPhone" data-i18n="booking.phoneLabel">Teléfono</label>
                <input type="tel" id="bookingPhone" name="telefono" required autocomplete="tel" placeholder="600 000 000">
            </div>

            <button type="submit" class="btn-primary booking-submit" id="bookingSubmit" hidden data-i18n="booking.submit">Confirmar cita</button>
        </form>

        <div class="booking-success" id="bookingSuccess" hidden>
            <p data-i18n="booking.successText">¡Cita confirmada! Te esperamos.</p>
            <p class="booking-success-note" data-i18n="booking.successNote">En breve recibirás un mensaje de confirmación de la cita.</p>
        </div>
    </div>
</div>
