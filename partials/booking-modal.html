<div class="booking-overlay" id="bookingOverlay" hidden>
    <div class="booking-modal" role="dialog" aria-modal="true" aria-labelledby="bookingTitle">
        <button type="button" class="booking-close" id="bookingClose" aria-label="Cerrar">&times;</button>

        <h2 id="bookingTitle">Pide tu cita</h2>

        <form id="bookingForm" novalidate>
            <div class="booking-field">
                <label for="bookingDate">Fecha</label>
                <input type="date" id="bookingDate" name="fecha" required>
            </div>

            <div class="booking-field" id="bookingSlotsField" hidden>
                <label>Hora</label>
                <div class="booking-slots" id="bookingSlots"></div>
            </div>

            <div class="booking-field" id="bookingStaffField" hidden>
                <label>Peluquero/a</label>
                <div class="booking-slots" id="bookingStaffOptions"></div>
            </div>

            <p class="booking-status" id="bookingStatus" aria-live="polite"></p>

            <div class="booking-field" id="bookingContactFields" hidden>
                <label for="bookingName">Nombre</label>
                <input type="text" id="bookingName" name="nombre" required autocomplete="name">

                <label for="bookingPhone">Teléfono</label>
                <div class="booking-phone-row">
                    <select id="bookingPhonePrefix" name="prefijo" aria-label="Prefijo">
                        <option value="+34" selected>🇪🇸 +34</option>
                        <option value="+351">🇵🇹 +351</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+33">🇫🇷 +33</option>
                        <option value="+49">🇩🇪 +49</option>
                        <option value="+39">🇮🇹 +39</option>
                        <option value="+1">🇺🇸 +1</option>
                    </select>
                    <input type="tel" id="bookingPhone" name="telefono" required autocomplete="tel" placeholder="600 000 000">
                </div>
            </div>

            <button type="submit" class="btn-primary booking-submit" id="bookingSubmit" hidden>Confirmar cita</button>
        </form>

        <div class="booking-success" id="bookingSuccess" hidden>
            <p>¡Cita confirmada! Te esperamos.</p>
            <button type="button" class="btn-primary" id="bookingNewOne">Pedir otra cita</button>
        </div>
    </div>
</div>
